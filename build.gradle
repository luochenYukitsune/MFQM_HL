plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'com.mfqm.morefunquicksandmod'
base { archivesName = "MFQM-neoforge-${minecraft_version}" }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

neoForge {
    version = neo_version

    runs {
        configureEach {
            gameDirectory = file("run/${minecraft_version}/${name}")
        }
        client {
            client()
            if (providers.gradleProperty('mfqmClientChecks').isPresent()) {
                systemProperty 'mfqm.clientChecks', 'true'
                programArguments.addAll '--quickPlaySingleplayer', 'mfqm-port-checks'
            }
            if (providers.gradleProperty('mfqmTextureChecks').isPresent()) {
                systemProperty 'mfqm.textureChecks', 'true'
            }
        }
        server {
            server()
            programArgument '--nogui'
            if (providers.gradleProperty('mfqmPortChecks').isPresent()) systemProperty 'mfqm.portChecks', 'true'
            if (providers.gradleProperty('mfqmPersistencePhase').isPresent()) systemProperty 'mfqm.persistencePhase', providers.gradleProperty('mfqmPersistencePhase').get()
            if (providers.gradleProperty('mfqmNaturalGlueChecks').isPresent()) systemProperty 'mfqm.naturalGlueChecks', 'true'
        }
        data {
            clientData()
            programArguments.addAll '--mod', 'mfqm', '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }

    mods {
        mfqm { sourceSet sourceSets.main }
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('runServer', JavaExec) {
    standardInput = System.in
}

// The motion suite is a plain Java assertion program; it has no JUnit dependency.
tasks.register('verifySinkingMotion', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mfqm.morefunquicksandmod.gameplay.SinkingMotionTest'
}
tasks.named('test', Test) { failOnNoDiscoveredTests = false }
tasks.named('check') { dependsOn tasks.named('verifySinkingMotion') }
['AdhesiveRules', 'StruggleRules', 'AdhesiveMotion', 'AdhesiveContact'].each { suite ->
    def verifier = tasks.register("verify${suite}", JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "com.mfqm.morefunquicksandmod.gameplay.${suite}Test"
    }
    tasks.named('check') { dependsOn verifier }
}
tasks.register('verifyStrugglePose', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mfqm.morefunquicksandmod.client.StrugglePoseTest'
}
tasks.named('check') { dependsOn tasks.named('verifyStrugglePose') }
tasks.register('verifyCoatingVoxels', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mfqm.morefunquicksandmod.client.CoatingVoxelsTest'
}
tasks.named('check') { dependsOn tasks.named('verifyCoatingVoxels') }
tasks.register('verifyCoatingAppearance', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mfqm.morefunquicksandmod.client.CoatingAppearanceTest'
}
tasks.named('check') { dependsOn tasks.named('verifyCoatingAppearance') }

tasks.register('verifyCompactStrandStyle', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mfqm.morefunquicksandmod.client.CompactStrandStyleTest'
}
tasks.named('check') { dependsOn tasks.named('verifyCompactStrandStyle') }

tasks.register('verifyWetAdhesiveStyle', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mfqm.morefunquicksandmod.client.WetAdhesiveStyleTest'
}
tasks.named('check') { dependsOn tasks.named('verifyWetAdhesiveStyle') }

// Export the dependency runtime without launching it; the installed test loads only mods/*.jar.
tasks.register('prepareInstalledClient') {
    dependsOn providers.provider { def run = tasks.named('runClient').get(); run.taskDependencies.getDependencies(run) }
    doLast {
        def run = tasks.named('runClient').get()
        // RunGameTask.exec() fills JavaExec.classpath only when launching. Read its
        // configured provider here; exporting JavaExec.classpath yields an empty list.
        def outputPaths = sourceSets.collectMany { it.output.files }.collect { it.canonicalPath }.toSet()
        def runtimeClasspath = run.classpathProvider.files.findAll {
            !outputPaths.contains(it.canonicalPath) && !it.name.startsWith('DevLaunch-')
        }
        if (runtimeClasspath.isEmpty()) throw new GradleException('Installed client dependency classpath is empty')
        def runtime = [classpath: runtimeClasspath.collect { it.absolutePath },
                       javaExecutable: run.javaLauncher.get().executablePath.asFile.absolutePath,
                       vmArgsFile: file('build/moddev/clientRunVmArgs.txt').absolutePath,
                       programArgsFile: file('build/moddev/clientRunProgramArgs.txt').absolutePath,
                       jar: tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath]
        file('build/installed-client-runtime.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(runtime))
    }
}

tasks.named('processResources', ProcessResources) {
    def metadata = [mod_version: mod_version, neo_version: neo_version,
                    minecraft_version_range: minecraft_version_range]
    inputs.properties metadata
    filesMatching('META-INF/neoforge.mods.toml') {
        expand metadata
    }
}

tasks.named('processResources', ProcessResources) {
    from(project.files('LICENSE', 'NOTICE.md')) { into 'META-INF' }
}
